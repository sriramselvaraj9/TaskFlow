[project]
name = "taskflow-backend"
version = "0.1.0"
description = "TaskFlow FastAPI Backend Service"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.29.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "greenlet>=3.1.0",
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.0",
    "python-dotenv>=1.0.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]
