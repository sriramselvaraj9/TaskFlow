services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_NAME: TaskFlow
      ENVIRONMENT: production
      DEBUG: "False"
      HOST: "0.0.0.0"
      PORT: 8000
      # PostgreSQL Global DB (localdb container on host port 5432)
      POSTGRES_SERVER: ${DOCKER_POSTGRES_SERVER:-postgres_db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@${DOCKER_POSTGRES_SERVER:-postgres_db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-mydb}
      # Redis Global Cache (localdb container on host port 6379)
      REDIS_HOST: ${DOCKER_REDIS_HOST:-redis_db}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_URL: redis://${DOCKER_REDIS_HOST:-redis_db}:${REDIS_PORT:-6379}/0
      # CORS & Auth
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://localhost:3002}
      JWT_SECRET: ${JWT_SECRET:-taskflow-super-secure-production-secret-key-32chars}
      # Email Service (Brevo)
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_USER: ${BREVO_USER:-}
      BREVO_FROM: ${BREVO_FROM:-TaskFlow Admin <noreply@taskflow.com>}
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taskflow_network
      - localdb_network

networks:
  taskflow_network:
    name: taskflow_network
    driver: bridge
  localdb_network:
    name: localdb_default
    external: true
